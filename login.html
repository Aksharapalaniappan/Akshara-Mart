<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Akshara Mart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Akshara Mart</h1>
        <p class="subtitle">Home Appliances, delivered right.</p>

        <div class="role-tabs">
            <button type="button" id="tabBuyer" class="active" onclick="selectRole('BUYER')">Buyer Login</button>
            <button type="button" id="tabSeller" onclick="selectRole('SELLER')">Seller Login</button>
        </div>

        <div id="errorBox" class="error-msg" style="display:none;"></div>
        <div id="successBox" class="success-msg" style="display:none;"></div>

        <form action="login" method="POST">
            <input type="hidden" name="role" id="roleInput" value="BUYER">

            <div class="form-group">
                <label>Email ID</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Login as Buyer</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
